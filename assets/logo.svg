<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" width="100%" height="100%">
  <defs>
    <!-- Icon Background Gradient -->
    <linearGradient id="logoIconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Text Accent Gradient -->
    <linearGradient id="logoTextAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="60%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="logoAccentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <style>
      .logo-title-omni {
        font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 23px;
        font-weight: 700;
        letter-spacing: -0.6px;
        fill: #0f172a;
      }
      .logo-title-article {
        font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 23px;
        font-weight: 700;
        letter-spacing: -0.6px;
        fill: url(#logoTextAccent);
      }
      .logo-sub {
        font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 8.5px;
        font-weight: 600;
        letter-spacing: 1.2px;
        fill: #64748b;
        text-transform: uppercase;
      }
      @media (prefers-color-scheme: dark) {
        .logo-title-omni { fill: #f8fafc; }
        .logo-sub { fill: #94a3b8; }
      }
    </style>
  </defs>

  <!-- ==================== ICON GROUP ==================== -->
  <g transform="translate(2, 2)">
    <!-- App Squircle Base (44x44) -->
    <rect width="44" height="44" rx="11" fill="url(#logoIconBg)" />

    <!-- Left Page (Original Article) -->
    <path d="M 21 12 C 16.5 10.5, 11 11.5, 8.2 13.3 C 7.6 13.7, 7.3 14.3, 7.3 15.1 L 7.3 29.3 C 7.3 30, 7.9 30.7, 8.6 30.4 C 11 29.3, 16 28.9, 21 30.2 Z" 
          fill="#ffffff" opacity="0.96" />

    <!-- Left Page Line Marks -->
    <line x1="11" y1="17" x2="17.5" y2="15.6" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round" />
    <line x1="11" y1="20.6" x2="17.5" y2="19.2" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round" opacity="0.8" />
    <line x1="11" y1="24.2" x2="15.8" y2="23" stroke="#2563eb" stroke-width="1.6" stroke-linecap="round" opacity="0.6" />

    <!-- Right Page (Translated Article) -->
    <path d="M 23 12 C 27.5 10.5, 33 11.5, 35.8 13.3 C 36.4 13.7, 36.7 14.3, 36.7 15.1 L 36.7 29.3 C 36.7 30, 36.1 30.7, 35.4 30.4 C 33 29.3, 28 28.9, 23 30.2 Z" 
          fill="#ffffff" opacity="0.96" />

    <!-- Right Page Translation Symbol 'A' -->
    <path d="M 29.8 16.5 L 27 24.8 M 29.8 16.5 L 32.6 24.8 M 27.9 22.5 L 31.7 22.5" 
          stroke="#7c3aed" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Translation Loop Ribbon -->
    <path d="M 16.5 33 C 19.2 35.8, 24.8 35.8, 27.5 33" 
          fill="none" stroke="url(#logoAccentGlow)" stroke-width="2.2" stroke-linecap="round" />

    <!-- Center Sparkle -->
    <circle cx="22" cy="20.5" r="1.3" fill="#38bdf8" />
  </g>

  <!-- ==================== TITLE GROUP ==================== -->
  <g transform="translate(56, 0)">
    <text x="0" y="27" class="logo-title-omni">Omni<tspan class="logo-title-article">Article</tspan></text>
    <text x="1" y="40" class="logo-sub">UNIVERSAL TRANSLATOR</text>
  </g>
</svg>
