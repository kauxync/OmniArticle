        stroke="#7c3aed" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Dynamic Translation Loop Connector -->
  <path d="M 18 36 C 21 39, 27 39, 30 36" 
        fill="none" stroke="url(#accentGlow)" stroke-width="2.5" stroke-linecap="round" />
  
  <!-- Central Sparkle Node -->
  <circle cx="24" cy="22" r="1.5" fill="#38bdf8" />
