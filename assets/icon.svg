  <line x1="12" y1="22.5" x2="19" y2="21" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round" opacity="0.8" />
  <line x1="12" y1="26.5" x2="17" y2="25.2" stroke="#2563eb" stroke-width="1.8" stroke-linecap="round" opacity="0.6" />

  <!-- Right Page (Translated Article) -->
  <path d="M 25 13 C 30 11.5, 36 12.5, 39 14.5 C 39.6 14.9, 40 15.6, 40 16.5 L 40 32 C 40 32.8, 39.4 33.5, 38.6 33.2 C 36 32, 30.5 31.5, 25 33 Z" 
