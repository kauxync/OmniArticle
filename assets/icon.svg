<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%">
  <defs>
    <linearGradient id="iconBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>

  <!-- Clean App Squircle Base -->
  <rect width="48" height="48" rx="12" fill="url(#iconBgGrad)" />

  <!-- Left Page (Original Article) -->
  <path d="M 23 13 C 18 11.5, 12 12.5, 9 14.5 C 8.4 14.9, 8 15.6, 8 16.5 L 8 32 C 8 32.8, 8.6 33.5, 9.4 33.2 C 12 32, 17.5 31.5, 23 33 Z" 
        fill="#ffffff" opacity="0.96" />

  <!-- Left Page Line Marks (Clean minimal document lines) -->
